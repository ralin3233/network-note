site_name: 網路課程筆記 - 實體層
site_description: 課程整理，寫給沒上課也能看懂的人
theme:
  name: material
  language: zh-TW
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首頁: index.md
  - 實體層 Physical Layer:
      - 實體層概論與路徑: physical-layer/index.md
      - 1. 正弦波特性與通式: physical-layer/sine-wave.md
      - 2. 方波構成與傅立葉分析: physical-layer/fourier-and-square-wave.md
      - 3. 頻寬與傅立葉轉換性質: physical-layer/bandwidth-and-capacity.md
      - 4. 數位調變、解調與適應性傳輸機制: physical-layer/modulation.md
  - AI 協作紀錄: ai-collaboration.md
